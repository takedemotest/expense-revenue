  @if (summary) {
<div class="action-card-container">
  <cards type="inline" [config]="expenseRevenue()">
  </cards>
</div>
  }
<ng-template #expense let-item>
  <span>₹{{ summary.totalExpense}}</span>
</ng-template>

<ng-template #revenue let-item>
  <span>₹{{ summary.totalRevenue }}</span>
</ng-template>

<ng-template #netProfit let-item>
  <span>₹{{ summary.netProfit }}</span>
</ng-template>

<ng-template #profitMarginPercent let-item>
  <span>{{ summary.profitMarginPercent }}</span>
</ng-template>


<agGrid-ui [config]="gridConfig()" [fetchService]="fetchFn" (actionTriggered)="handleAction($event)">
</agGrid-ui>
